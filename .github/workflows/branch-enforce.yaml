name: Branch Enforcement

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  enforce:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      HEAD_REF: ${{ github.head_ref }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: ncalteen/branch-enforcement@v2
        with:
          policy: |
            *:develop
            # Explicit one-level branch prefixes: "*" alone does not match "/".
            feature/*:develop
            fix/*:develop
            # Fork staging supports reviewable stacked fix branches.
            fix/*:fix/*
            develop:beta
            hotfix/*:beta
            hotfix/*:main
            beta:main
          head_ref: ${{ env.HEAD_REF }}
          base_ref: ${{ env.BASE_REF }}
